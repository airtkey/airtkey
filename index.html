<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>airtkey Dokumentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Dokumentation von airtkey">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Modernes Themeable-CSS für ein sauberes Layout (GitBook-Style) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
  
  <!-- CSS für den coolen Dark/Light Mode Switcher -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-darklight-theme@3/dist/docsify-darklight.min.css" title="docsify-darklight-theme" type="text/css" />

  <style>
    /* Kleine optische Anpassungen für das GitBook-Gefühl */
    :root {
      --theme-color: #3f51b5; /* Ein schickes Indigo-Blau als Akzentfarbe */
      --sidebar-width: 280px;
    }
    .sidebar {
      font-size: 14px;
    }
    .markdown-section {
      max-width: 850px; /* Angenehmere Lesebreite */
      padding-top: 40px;
    }
    /* Suchfeld hübscher machen */
    .search input {
      border-radius: 6px !important;
      background: rgba(0, 0, 0, 0.05) !important;
    }
  </style>
</head>
<body>
  <div id="app">Lade Dokumentation...</div>
  
  <script>
    window.$docsify = {
      name: 'airtkey Docs',
      repo: 'https://github.com/airtkey/airtkey',
      loadSidebar: true,
      
      // Nutzt das GitBook-Inhaltsverzeichnis (SUMMARY.md) als Seitenleiste
      alias: {
        '/.*/_sidebar.md': '/SUMMARY.md',
        '/_sidebar.md': '/SUMMARY.md'
      },
      
      subMaxLevel: 2,
      auto2top: true,
      
      // Einstellungen für die Suchfunktion
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Suche...',
        noData: 'Keine Ergebnisse gefunden!',
        depth: 6
      },
      
      // Einstellungen für den Dark/Light Mode
      darklightTheme: {
        siteFont: "Source Sans Pro, Helvetica Neue, Arial, sans-serif",
        defaultTheme: 'light',
        codeFontFamily: 'Roboto Mono, Monaco, courier, monospace',
        bodyFontSize: '15px',
        dark: {
          background: '#1e222b',
          toggleBtnBg: '#3f51b5',
          textColor: '#abb2bf'
        },
        light: {
          background: '#ffffff',
          toggleBtnBg: '#3f51b5',
          textColor: '#2c3e50'
        }
      }
    }
  </script>
  
  <!-- Docsify Core-Engine -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  
  <!-- Plugin: Echtzeit-Volltextsuche -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  
  <!-- Plugin: Dark/Light Mode Switcher -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-darklight-theme@3/dist/docsify-darklight.min.js" type="text/javascript"></script>
  
  <!-- Plugin: "Copy to Clipboard" Button für Code-Blöcke -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
</body>
</html>
